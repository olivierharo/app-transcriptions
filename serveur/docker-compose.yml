# Deploiement sur le VPS :
#   1. cp .env.exemple .env   puis renseigner DOMAINE (enregistrement DNS A vers le VPS)
#   2. docker compose up -d --build
#   3. docker compose exec relais python admin.py creer <prenom>
services:
  relais:
    build: .
    restart: unless-stopped
    environment:
      RELAIS_URL: https://${DOMAINE}
    volumes:
      - donnees:/donnees

  # Caddy : HTTPS automatique (certificat Let's Encrypt obtenu et renouvele seul).
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAINE: ${DOMAINE}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_donnees:/data
      - caddy_config:/config
    depends_on:
      - relais

volumes:
  donnees:
  caddy_donnees:
  caddy_config:
